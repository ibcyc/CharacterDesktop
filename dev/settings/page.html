<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色收藏播放器</title>
<style>
:root{color-scheme:dark;--bg:#080909;--card:#1b2721;--field:rgba(0,0,0,.5);--line:rgba(255,255,255,.16);--text:#f1f3ef;--soft:#b9c2b8;--accent:#c2d8a7;--gap:18px;--side:270px}*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,"Microsoft JhengHei",sans-serif;overflow:hidden}
button,select,input[type=url]{font:inherit;border:1px solid var(--line);border-radius:9px;color:var(--text);background:var(--field);padding:8px 11px}button{cursor:pointer;white-space:nowrap}button:disabled,select:disabled{opacity:.45;cursor:default}.primary{background:var(--accent);color:#1a2c1c;border-color:var(--accent);font-weight:650}
.row{display:flex;gap:7px;align-items:center}.row>input,.row>select{flex:1;min-width:0}
/* The preview fills the window; the controls float above it without panels. */
.stage{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 45%,#1e2121,#050606 75%);overflow:hidden}canvas{display:block;width:100%;height:100%;cursor:pointer;touch-action:none}
canvas.panning{cursor:grabbing}
.panel{position:fixed;z-index:2;width:var(--side);max-height:calc(100% - 2*var(--gap) - 90px);overflow:auto}.panel-left{top:var(--gap);left:var(--gap)}.panel-right{top:var(--gap);right:var(--gap)}
.panel label,#status,#usage,.empty{text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 12px rgba(0,0,0,.6)}
.empty{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;text-align:center;pointer-events:none;padding:32px}.empty h2{font-size:22px;letter-spacing:1px;margin:0 0 6px}.empty p{color:var(--soft);margin:0}
.top-line{position:fixed;z-index:1;top:calc(var(--gap) - 4px);left:50%;transform:translateX(-50%);max-width:calc(100% - 4*var(--gap) - 2*var(--side));display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none}#usage{font-size:10px;color:var(--soft);opacity:.75}#usage:empty{display:none}#status{margin:0;font-size:12px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
label{display:block;color:var(--soft);font-size:12px;margin:0 0 6px}select{width:100%}.field{margin-top:12px}.panel>.field:first-child{margin-top:0}input[type=range]{width:100%;margin:0;accent-color:var(--accent)}label span{float:right;color:var(--text)}
#errors{white-space:pre-wrap;max-height:120px;overflow:auto;color:#f0c3a0;font-size:11px;margin:10px 0 0;text-shadow:0 1px 3px #000}#errors:empty{display:none}
.app-dock{position:fixed;z-index:3;right:var(--gap);bottom:var(--gap);display:flex;flex-direction:column;align-items:flex-end;gap:8px}.app-dock-row{display:flex;gap:8px}.menu-item{position:relative;display:flex;flex-direction:column}.submenu{position:absolute;right:calc(100% + 6px);top:0;display:flex;gap:6px}.submenu button{white-space:nowrap}.app-menu{display:flex;flex-direction:column;gap:6px}.app-menu-status{margin:0;max-width:260px;font-size:11px;color:var(--accent);text-align:right;text-shadow:0 1px 3px #000}.app-menu-status:empty{display:none}.app-menu button{min-width:72px;font-size:12px;padding:7px 12px}a{color:var(--accent)}.hidden,[hidden]{display:none!important}
.visibility-dock{position:fixed;z-index:2;left:50%;bottom:var(--gap);transform:translateX(-50%)}
.download-dock{position:fixed;z-index:3;left:var(--gap);bottom:var(--gap);display:flex;flex-direction:column;gap:8px}.dock-row{position:relative;display:flex}.download-dock>[data-slot]{display:contents}
#download-progress{display:none;width:100%;height:5px;margin-top:8px;accent-color:var(--accent)}#download-progress.active{display:block}#download-status{font-size:12px;color:var(--accent);margin-top:6px}#download-status:empty{display:none}
/* Nothing can be selected or dragged, except the text in the address bar. */
body{user-select:none}input[type=url],input[type=text]{user-select:text}img,a{-webkit-user-drag:none}
</style></head><body>
<div class="title-bar"><button id="window-minimize" class="window-button" type="button" title="最小化" aria-label="最小化"><svg viewBox="0 0 12 12" width="11" height="11" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.1" d="M1 6.5h10"/></svg></button><button id="window-maximize" class="window-button" type="button" title="最大化" aria-label="最大化"><svg viewBox="0 0 12 12" width="11" height="11" aria-hidden="true"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.1"/></svg></button><button id="window-close" class="window-button close" type="button" title="關閉" aria-label="關閉"><svg viewBox="0 0 12 12" width="11" height="11" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.1" d="M1.5 1.5l9 9M10.5 1.5l-9 9"/></svg></button></div>
<div id="stage" class="stage"><canvas id="viewer-canvas" role="button" tabindex="0" aria-label="角色預覽：滾輪縮放、右鍵拖曳、左鍵互動" title="滾輪縮放 · 右鍵拖曳 · 左鍵互動"></canvas><img id="viewer-image" class="local-image" alt="" hidden><div id="empty" class="empty"><div><h2>還沒有角色</h2><p>按左下角的按鈕下載角色，或加入自己的圖片。</p></div></div></div>
<div class="top-line"><span id="usage" title="這個 App 所有程序合計的記憶體使用量"></span><p id="status" hidden>滾輪縮放 · 右鍵拖曳 · 左鍵互動</p></div>
<aside class="panel panel-left">
<div class="field" id="character-field" hidden><label for="character">角色</label><div class="row"><select id="character" aria-label="角色" disabled></select><button id="character-rename" class="icon-button" type="button" title="改名" aria-label="改名" hidden><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M4 17.2V20h2.8l9.9-9.9-2.8-2.8L4 17.2zm15.7-9.4a1 1 0 0 0 0-1.4l-2.1-2.1a1 1 0 0 0-1.4 0l-1.6 1.6 2.8 2.8 2.3-.9z"/></svg></button><button id="character-reset" class="icon-button" type="button" title="把這個角色恢復成預設狀態" aria-label="把這個角色恢復成預設狀態" hidden><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button><button id="character-delete" class="icon-button" type="button" title="刪除這個角色" aria-label="刪除這個角色" hidden><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M9 3h6l1 2h4v2H4V5h4l1-2zm-3 6h12l-1 12H7L6 9zm4 2v8h2v-8h-2zm4 0v8h2v-8h-2z"/></svg></button></div><form class="row rename-row" id="rename-row" hidden><input id="rename-input" type="text" aria-label="新的名稱" maxlength="40" required spellcheck="false"><button id="rename-save" class="primary" type="submit">儲存</button><button id="rename-cancel" type="button">取消</button></form></div>
<div class="field" id="mirror-field" hidden><label class="switch-row" for="mirror-toggle"><span>水平鏡像</span><input id="mirror-toggle" class="switch" type="checkbox" role="switch"></label></div>
<div data-slot="before-expression"></div>
<div class="field" id="expression-field" hidden><label for="expression">表情</label><select id="expression" disabled></select></div>
<div class="field" id="tuning-field" hidden><label class="switch-row" for="tuning-toggle"><span>細部調整</span><input id="tuning-toggle" class="switch" type="checkbox" role="switch"></label></div>
<div id="tuning-options" hidden><div class="field"><label for="tuning-breath">呼吸強度 <span id="tuning-breath-label"></span></label><input id="tuning-breath" type="range"></div><div class="field"><label for="tuning-rate">呼吸頻率 <span id="tuning-rate-label"></span></label><input id="tuning-rate" type="range"></div><div class="field"><label for="tuning-bounce">戳的彈跳強度 <span id="tuning-bounce-label"></span></label><input id="tuning-bounce" type="range"></div><div class="field" id="tuning-poke-field"><label for="tuning-poke">戳的表情</label><select id="tuning-poke"></select></div><div class="field" id="tuning-fifth-field"><label for="tuning-fifth">戳第 5 下的表情</label><select id="tuning-fifth"></select></div></div>
<div data-slot="after-expression"></div>
<p id="errors" role="alert"></p>
</aside>
<aside class="panel panel-right" id="desktop-panel" hidden><!--desktop-panel--></aside>
<div class="visibility-dock"><!--desktop-visible--></div>
<div class="download-dock"><!--desktop-top--></div>
<section id="sources-panel" class="sources-panel" hidden></section><section id="ui-panel" class="sources-panel ui-panel" hidden><h3>UI 設定</h3><div class="field"><label for="ui-transparency">背景透明度 <span id="ui-transparency-label"></span></label><input id="ui-transparency" type="range" min="0" max="100" value="0"></div><div class="field" id="ui-blur-field"><label class="switch-row" for="ui-blur"><span>模糊</span><input id="ui-blur" class="switch" type="checkbox" role="switch" checked></label></div></section>
<div id="tool-host" class="tool-host" hidden><div data-slot="tool"></div></div>
<div id="layer-menu" class="layer-menu" hidden><button id="layer-group" type="button">組合</button></div>
<div class="app-dock"><p id="app-menu-status" class="app-menu-status" role="status" aria-live="polite"></p><div id="app-menu" class="app-menu" hidden><button id="sources-toggle" type="button" aria-expanded="false" aria-controls="sources-panel">來源</button><div class="menu-item" id="tools-item" hidden><button id="tools-toggle" type="button" aria-expanded="false" aria-controls="tools-menu">工具</button><div id="tools-menu" class="submenu" hidden></div></div><button id="pack-export" type="button" title="把所有角色（圖片與設定，不含桌面上的位置）匯出成一個 .cdpack 角色包">匯出</button><div class="menu-item" id="settings-item"><button id="settings-toggle" type="button" aria-expanded="false" aria-controls="settings-menu">設定</button><div id="settings-menu" class="submenu" hidden><button id="ui-toggle" type="button" aria-expanded="false" aria-controls="ui-panel">UI 設定</button></div></div><button id="relaunch" type="button" title="重新啟動程序（例如加入或移除擴充功能之後）">重啟</button><div class="menu-item"><button id="reset-toggle" type="button" aria-expanded="false" aria-controls="reset-menu">還原</button><div id="reset-menu" class="submenu" hidden><button id="reset-settings" type="button" title="每個角色的設定回到預設；角色與桌面上的位置保留">所有角色設定</button><button id="reset-all" class="danger" type="button" title="刪除所有角色與設定，回到剛安裝的狀態">完全還原</button><button id="reset-ui" type="button" title="UI 設定回到預設">還原 UI 設定</button></div></div></div><div id="group-edit" class="group-edit" hidden><span id="group-edit-name" class="group-edit-name"></span><button id="group-cancel" class="icon-button" type="button" title="取消編輯" aria-label="取消編輯"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg></button><button id="group-save" class="primary" type="button">保存</button></div><div class="app-dock-row"><button id="quit" class="fab power" type="button" title="結束程序" aria-label="結束程序"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M12 3.5v8M7.2 6.4a7 7 0 1 0 9.6 0"/></svg></button><div class="groups-dock"><div id="groups-panel" class="groups-panel" hidden></div><button id="groups-toggle" class="fab" type="button" aria-expanded="false" aria-controls="groups-panel" title="組合" aria-label="組合"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M12 3 2 8l10 5 10-5-10-5zM2 12l10 5 10-5M2 16l10 5 10-5"/></svg></button></div><button id="app-menu-toggle" class="fab" type="button" aria-expanded="false" aria-controls="app-menu" title="選單" aria-label="選單"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg></button></div></div>
<div id="dialog" class="dialog-backdrop" hidden><div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialog-message" aria-describedby="dialog-detail"><p id="dialog-title" class="dialog-title"></p><p id="dialog-message" class="dialog-message"></p><p id="dialog-detail" class="dialog-detail"></p><input id="dialog-input" class="dialog-input" type="text" maxlength="40" spellcheck="false" hidden><label id="dialog-check" class="dialog-check" hidden><input id="dialog-checkbox" type="checkbox"><span id="dialog-check-label"></span></label><div id="dialog-buttons" class="dialog-buttons"></div></div></div>
<noscript>請用啟用 JavaScript 的 Chrome 或 Edge 開啟這個 HTML。</noscript>
<!--vendor-scripts-->
<script>
var ready=false;
function showError(e){window.playerFailed=true;document.getElementById('errors').textContent='無法完成：'+(e&&e.message||e);console.error(e);}
window.addEventListener('error',e=>showError(e.error||e.message));
window.addEventListener('unhandledrejection',e=>showError(e.reason));
</script><script>__APP__
</script></body></html>
