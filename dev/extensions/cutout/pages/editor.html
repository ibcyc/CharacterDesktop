<div id="cut" class="cut">
<div id="cut-stage" class="cut-stage"><canvas id="cut-canvas" class="cut-canvas"></canvas>
<div id="cut-drop" class="cut-drop"><svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M4 16.5V19a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2.5M12 15V4m0 0L8 8m4-4 4 4"/></svg><span>拖入照片</span></div>
<div id="cut-busy" class="cut-busy" hidden><div class="cut-ring"></div><span id="cut-percent"></span></div></div>
<div id="cut-queue" class="cut-queue" hidden></div>
<div id="cut-tools" class="cut-tools" hidden>
<button id="cut-erase" class="icon-button" type="button" aria-pressed="true" title="擦除" aria-label="擦除"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="m4 14 9-10a2 2 0 0 1 3 0l5 5a2 2 0 0 1 0 3l-9 9H7l-3-4a2 2 0 0 1 0-3Zm5-5 9 9M12 21h9"/></svg></button>
<button id="cut-restore" class="icon-button" type="button" aria-pressed="false" title="還原" aria-label="還原"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="m9 14 9-11 3 3-11 10M9 14c-5-2-2 7-7 6 4 4 11 0 8-4"/></svg></button>
<input id="cut-size" class="cut-size" type="range" min="4" max="240" value="40" aria-label="筆刷大小" title="筆刷大小">
</div>
<div id="cut-options" class="cut-options" hidden>
<div class="cut-segment" role="group" aria-label="邊緣"><button id="cut-clean" type="button" aria-pressed="true" title="減少背景色邊">乾淨</button><button id="cut-natural" type="button" aria-pressed="false" title="保留原本的顏色">自然</button></div>
<button id="cut-trim" class="icon-button" type="button" aria-pressed="true" title="裁掉透明邊（加入與下載時）" aria-label="裁邊"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M6 2v14a2 2 0 0 0 2 2h14M2 6h14a2 2 0 0 1 2 2v14"/></svg></button>
<button id="cut-compare" class="icon-button" type="button" aria-pressed="false" title="原圖" aria-label="原圖"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
</div>
<p id="cut-message" class="cut-message" role="alert"></p>
<div class="cut-actions">
<div class="cut-add"><div id="cut-add-menu" class="cut-add-menu" hidden></div><button id="cut-add" class="primary" type="button" aria-haspopup="menu" aria-expanded="false" disabled>加入</button></div>
<button id="cut-save" class="icon-button" type="button" title="下載" aria-label="下載" disabled><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path fill="currentColor" d="M11 4h2v9.2l3.6-3.6 1.4 1.4-6 6-6-6 1.4-1.4 3.6 3.6V4zM5 18h14v2H5z"/></svg></button>
<button id="cut-close" class="icon-button" type="button" title="關閉" aria-label="關閉"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
</div>
